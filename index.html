<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6e8">
  <title>奶蛙大进化</title>
  <link rel="stylesheet" href="style.css?v=frog-images-2">
</head>
<body>
  <main class="home" aria-labelledby="game-title">
    <div class="sun" aria-hidden="true">✦</div>
    <section class="intro">
      <p class="eyebrow">MILK FROG EVOLUTION</p>
      <div class="frog"><img src="assets/frogs/level-1.jpg" alt="一级奶蛙"></div>
      <h1 id="game-title">奶蛙大进化</h1>
      <p class="subtitle">合成奶蛙，一起进化！</p>
      <div class="actions">
        <button id="start" class="primary" type="button">开始游戏</button>
        <div class="secondary-actions">
          <button id="rules" type="button">游戏规则</button>
          <button id="collection" type="button">奶蛙图鉴</button>
        </div>
        <p class="hint">方向键 / WASD 或点击方向按钮移动</p>
      </div>
    </section>
    <section id="game" class="game" hidden aria-label="游戏棋盘">
      <h2>奶蛙大进化</h2>
      <p>分数：<strong id="score">0</strong> · 最高等级：<strong id="level">1</strong></p>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="board" class="board" role="group" aria-label="4 行 4 列棋盘" tabindex="0"></div>
      <div class="controls"><button id="undo">撤销</button><button id="restart">重新开始</button><button id="home">返回首页</button></div>
      <div class="directions" aria-label="移动方向"><button data-direction="up" aria-label="向上">↑</button><button data-direction="left" aria-label="向左">←</button><button data-direction="down" aria-label="向下">↓</button><button data-direction="right" aria-label="向右">→</button></div>
      <p class="hint">方向键 / WASD 或点击方向按钮移动，相同等级合成进化。</p>
    </section>
    <dialog id="info"><h2 id="info-title"></h2><div id="info-body"></div><button id="close-info">关闭</button></dialog>
    <footer>一起来收集所有奶蛙吧！</footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
