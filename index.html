<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6e8">
  <title>奶蛙大进化</title>
  <link rel="stylesheet" href="style.css?v=kiss-1">
</head>
<body>
  <main class="home" aria-labelledby="game-title">
    <div class="sun" aria-hidden="true">✦</div>
    <section class="intro">
      <p class="eyebrow">MILK FROG EVOLUTION</p>
      <div class="frog"><img src="assets/frogs/level-1.jpg" alt="一级奶蛙" width="132" height="132" style="display:block;width:100%;height:100%;max-width:100%;object-fit:contain"></div>
      <h1 id="game-title">奶蛙大进化</h1>
      <p class="subtitle">合成奶蛙，一起进化！</p>
      <div class="actions">
        <button id="start" class="primary" type="button">开始游戏</button>
        <div class="secondary-actions">
          <button id="rules" type="button">游戏规则</button>
          <button id="collection" type="button">奶蛙图鉴</button>
        </div>
        <p class="hint">每次操作，整个棋盘的奶蛙一起移动，无需选择。</p>
      </div>
    </section>
    <section id="game" class="game" hidden aria-label="游戏棋盘">
      <h2>奶蛙大进化</h2>
      <p>分数：<strong id="score">0</strong> · 最高等级：<strong id="level">1</strong></p>
      <p>历史最高：<strong id="best">0</strong></p><p id="save-status" class="hint"></p><p id="status" role="status" aria-live="polite"></p>
      <div id="board" class="board" role="group" aria-label="4 行 4 列棋盘" tabindex="0"></div>
      <p class="swipe-tip">☝ 在棋盘上滑动，就能移动所有奶蛙</p>
      <div class="controls"><button id="undo">撤销</button><button id="restart">重新开始</button><button id="home">返回首页</button><button id="sound" aria-pressed="true">音效：开</button></div>
      <div class="directions" aria-label="移动方向"><button data-direction="up" aria-label="向上">↑</button><button data-direction="left" aria-label="向左">←</button><button data-direction="down" aria-label="向下">↓</button><button data-direction="right" aria-label="向右">→</button></div>
      <p class="hint">所有奶蛙一起向所选方向滑到底，可跨多格；无需选中某只奶蛙。</p>
      <button id="game-rules" type="button">查看详细规则</button>
    </section>
    <dialog id="info"><h2 id="info-title"></h2><div id="info-body"></div><button id="close-info">关闭</button></dialog>
    <dialog id="game-over" class="game-over" aria-labelledby="game-over-title" aria-describedby="game-over-score">
      <div class="sad-face" aria-hidden="true">🥺</div>
      <h2 id="game-over-title">棋盘满啦</h2>
      <figure id="kiss-reward" hidden><img src="assets/frogs/kiss-reward.png" alt="奶蛙送给你的通关亲亲"><figcaption>通关奖励 · 奶蛙亲亲 💋</figcaption></figure>
      <p id="result-description">已经没有可以移动或合并的奶蛙，本局结束。</p>
      <p id="game-over-score"></p>
      <div class="controls"><button id="play-again" class="primary">再玩一次</button><button id="undo-failure">撤销一步</button><button id="view-board">查看棋盘</button></div>
    </dialog>
    <footer>一起来收集所有奶蛙吧！</footer>
  </main>
  <script type="module" src="js/main.js?v=kiss-1"></script>
</body>
</html>
