<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6e8">
  <title>奶蛙大进化</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="home" aria-labelledby="game-title">
    <div class="sun" aria-hidden="true">✦</div>
    <section class="intro">
      <p class="eyebrow">MILK FROG EVOLUTION</p>
      <div class="frog" role="img" aria-label="绿色奶蛙">🐸</div>
      <h1 id="game-title">奶蛙大进化</h1>
      <p class="subtitle">合成奶蛙，一起进化！</p>
      <div class="actions">
        <button class="primary" type="button" disabled>开始游戏</button>
        <div class="secondary-actions">
          <button type="button" disabled>游戏规则</button>
          <button type="button" disabled>奶蛙图鉴</button>
        </div>
        <p class="hint">游戏即将开始，敬请期待</p>
      </div>
    </section>
    <footer>一起来收集所有奶蛙吧！</footer>
  </main>
</body>
</html>
